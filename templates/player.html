<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest/{{ slug }}.json">
<title>{{ screen.name }} — Player LED</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: system-ui, -apple-system, sans-serif;
  }
  body.hide-cursor {
    cursor: none;
  }
  #stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .media-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    pointer-events: none;
    background: #000;
  }
  .media-layer.fade-enabled {
    transition: opacity 0.45s ease-in-out;
  }
  .media-layer.active {
    opacity: 1;
    z-index: 2;
  }
  #msg {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #9ca3af;
    text-align: center;
    padding: 24px;
    z-index: 5;
    background: radial-gradient(circle, #111827 0%, #000 100%);
  }
  #msg .logo {
    font-size: 32px;
    font-weight: 900;
    background: linear-gradient(90deg, #ff5252, #fb8c00, #fdd835, #43a047, #29b6f6, #ab47bc);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 10px;
  }
  #msg .screen-title {
    font-size: 20px;
    color: #e5e7eb;
    font-weight: 700;
    margin-bottom: 6px;
  }
  #msg .hint {
    font-size: 15px;
    color: #6b7280;
  }
  /* Floating HUD controls - hidden when idle */
  #hud {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 20;
    display: flex;
    gap: 10px;
    align-items: center;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    padding: 8px 14px;
    border-radius: 99px;
    color: #fff;
    font-size: 13px;
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
  }
  #hud.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  #hud button {
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    border: 0;
    padding: 6px 12px;
    border-radius: 99px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  #hud button:hover {
    background: rgba(255, 255, 255, 0.25);
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4ade80;
    display: inline-block;
  }
  .dot.offline {
    background: #f59e0b;
  }
</style>
</head>
<body class="hide-cursor">
  <div id="stage">
    <img id="imA" class="media-layer" alt="">
    <img id="imB" class="media-layer" alt="">
    <video id="vdA" class="media-layer" playsinline preload="auto"></video>
    <video id="vdB" class="media-layer" playsinline preload="auto"></video>

    <div id="msg">
      <img src="/static/logo-shopcor.jpg" alt="{{ brand_name }}" style="height: 90px; border-radius: 12px; margin-bottom: 14px; box-shadow: 0 8px 25px rgba(0,0,0,0.6);">
      <div class="logo">{{ brand_name }}</div>
      <div class="screen-title">{{ screen.name }}</div>
      <div class="hint" id="msgText">Carregando programação do painel LED…</div>
    </div>
  </div>

  <div id="hud">
    <span class="dot" id="netDot"></span>
    <span id="hudStatus">{{ screen.name }}</span>
    <button type="button" id="btnSound" onclick="toggleSound()">🔇 Mudo</button>
    <button type="button" id="btnNext" onclick="nextItem()">⏭️ Próximo</button>
    <button type="button" id="btnFs" onclick="toggleFullscreen()">⛶ Tela Cheia</button>
  </div>

<script>
const SLUG = "{{ slug }}";
const STORAGE_KEY = "painel_led_playlist_" + SLUG;
const CACHE_NAME = "painel-led-media-v1";

const stage = document.getElementById("stage");
const msg = document.getElementById("msg");
const msgText = document.getElementById("msgText");
const hud = document.getElementById("hud");
const netDot = document.getElementById("netDot");
const hudStatus = document.getElementById("hudStatus");
const btnSound = document.getElementById("btnSound");

const layers = {
  imA: document.getElementById("imA"),
  imB: document.getElementById("imB"),
  vdA: document.getElementById("vdA"),
  vdB: document.getElementById("vdB")
};

let activeLayer = null;
let useBufferA = true;
let list = [];
let idx = -1;
let sig = "";
let timer = null;
let watchdog = null;
let currentMediaName = "";
let soundUnlocked = location.search.includes("som=1");
let screenCfg = {
  fit_mode: "{{ screen.fit_mode or 'cover' }}",
  rotation: {{ screen.rotation or 0 }},
  muted: {{ 'false' if screen.muted == 0 else 'true' }},
  transition: "{{ screen.transition or 'fade' }}"
};

if (location.search.includes("som=1")) {
  screenCfg.muted = false;
}

// Memory blob cache for offline resilience
const blobUrls = {};

function applyScreenConfig(cfg) {
  screenCfg = Object.assign(screenCfg, cfg || {});
  if (location.search.includes("som=1")) {
    screenCfg.muted = false;
  }
  const fit = screenCfg.fit_mode || "cover";
  const fade = (screenCfg.transition || "fade") === "fade";
  Object.values(layers).forEach(el => {
    el.style.objectFit = fit;
    if (fade) el.classList.add("fade-enabled");
    else el.classList.remove("fade-enabled");
  });

  // Rotation handling
  const rot = parseInt(screenCfg.rotation || 0, 10);
  if (rot === 90 || rot === 270) {
    stage.style.width = "100vh";
    stage.style.height = "100vw";
    stage.style.top = "50%";
    stage.style.left = "50%";
    stage.style.transform = `translate(-50%, -50%) rotate(${rot}deg)`;
  } else if (rot === 180) {
    stage.style.width = "100vw";
    stage.style.height = "100vh";
    stage.style.top = "0";
    stage.style.left = "0";
    stage.style.transform = "rotate(180deg)";
  } else {
    stage.style.width = "100vw";
    stage.style.height = "100vh";
    stage.style.top = "0";
    stage.style.left = "0";
    stage.style.transform = "none";
  }

  updateSoundButton();
}

function updateSoundButton() {
  const isMuted = screenCfg.muted && !soundUnlocked;
  btnSound.textContent = isMuted ? "🔇 Som Desligado" : "🔊 Som Ligado";
  layers.vdA.muted = isMuted;
  layers.vdB.muted = isMuted;
}

function toggleSound() {
  soundUnlocked = !soundUnlocked;
  screenCfg.muted = !soundUnlocked;
  updateSoundButton();
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
}

// Preload media into CacheStorage / Blob URLs so offline playback never stutters
async function preloadMediaItems(items) {
  // Em TV Boxes / WebView Kiosk, o carregamento direto é 100% mais confiável e não trava com blob
}

function getPlayableUrl(url) {
  return url;
}

async function syncPlaylist() {
  try {
    const q = currentMediaName ? "?playing=" + encodeURIComponent(currentMediaName) : "";
    const r = await fetch("/api/playlist/" + SLUG + q, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();

    netDot.classList.remove("offline");
    hudStatus.textContent = (data.screen && data.screen.name) ? data.screen.name : "Online";

    if (data.screen) {
      applyScreenConfig(data.screen);
    }

    const items = Array.isArray(data) ? data : (data.items || []);
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ screen: data.screen, items }));

    const newSig = JSON.stringify(items.map(x => `${x.id}:${x.url}:${x.duration}`));
    if (newSig !== sig) {
      const wasEmpty = list.length === 0;
      sig = newSig;
      list = items;
      preloadMediaItems(list);
      if (idx >= list.length) idx = -1;
      if (wasEmpty || list.length === 0) {
        nextItem();
      }
    }
  } catch (e) {
    netDot.classList.add("offline");
    hudStatus.textContent = "Modo Offline (Cache)";
    if (list.length === 0) {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        if (saved && saved.items && saved.items.length) {
          if (saved.screen) applyScreenConfig(saved.screen);
          list = saved.items;
          preloadMediaItems(list);
          nextItem();
        }
      } catch (err) {}
    }
  }
}

function showEmptyState() {
  clearTimeout(timer);
  clearTimeout(watchdog);
  currentMediaName = "";
  Object.values(layers).forEach(el => {
    el.classList.remove("active");
    if (el.tagName === "VIDEO") {
      try { el.pause(); } catch (e) {}
    }
  });
  msgText.textContent = "Nenhuma propaganda ativa nesta tela no momento.";
  msg.style.display = "flex";
}

function activateLayer(newEl) {
  msg.style.display = "none";
  if (activeLayer && activeLayer !== newEl) {
    const prev = activeLayer;
    prev.classList.remove("active");
    if (prev.tagName === "VIDEO") {
      setTimeout(() => {
        if (prev !== activeLayer) {
          try { prev.pause(); } catch (e) {}
        }
      }, 450);
    }
  }
  newEl.classList.add("active");
  activeLayer = newEl;
}

function nextItem() {
  clearTimeout(timer);
  clearTimeout(watchdog);

  if (!list.length) {
    showEmptyState();
    return;
  }

  idx = (idx + 1) % list.length;
  const it = list[idx];
  currentMediaName = it.name || "";
  useBufferA = !useBufferA;

  const mediaUrl = getPlayableUrl(it.url);

  if (it.kind === "image") {
    const imgEl = useBufferA ? layers.imA : layers.imB;
    imgEl.onload = () => {
      activateLayer(imgEl);
      timer = setTimeout(nextItem, Math.max(1, it.duration || 10) * 1000);
    };
    imgEl.onerror = () => {
      timer = setTimeout(nextItem, 1500);
    };
    imgEl.src = mediaUrl;
  } else {
    // If single video in playlist and already playing same video, loop smoothly
    if (list.length === 1 && activeLayer && activeLayer.tagName === "VIDEO" && activeLayer.dataset.rawUrl === it.url) {
      activeLayer.currentTime = 0;
      activeLayer.play().catch(() => { timer = setTimeout(nextItem, 2000); });
      return;
    }

    const vidEl = useBufferA ? layers.vdA : layers.vdB;
    vidEl.dataset.rawUrl = it.url;
    vidEl.muted = screenCfg.muted && !soundUnlocked;
    vidEl.loop = false;
    vidEl.onended = () => nextItem();
    vidEl.onerror = () => {
      timer = setTimeout(nextItem, 1500);
    };

    // Safety watchdog in case a video stalls
    watchdog = setTimeout(() => nextItem(), 5 * 60 * 1000);

    vidEl.src = mediaUrl;
    vidEl.load();
    const playPromise = vidEl.play();
    if (playPromise !== undefined) {
      playPromise.then(() => {
        activateLayer(vidEl);
      }).catch(() => {
        // Browser blocked unmuted autoplay -> fallback to muted so LED panel never stops
        vidEl.muted = true;
        vidEl.play().then(() => {
          activateLayer(vidEl);
        }).catch(() => {
          timer = setTimeout(nextItem, 2000);
        });
      });
    } else {
      activateLayer(vidEl);
    }
  }
}

// Keep screen awake on supported browsers / TV boxes
async function requestWakeLock() {
  if ("wakeLock" in navigator) {
    try {
      await navigator.wakeLock.request("screen");
    } catch (e) {}
  }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") requestWakeLock();
});

// Show HUD briefly on mouse move or touch
let hudTimer = null;
function showHudTemporarily() {
  document.body.classList.remove("hide-cursor");
  hud.classList.add("visible");
  clearTimeout(hudTimer);
  hudTimer = setTimeout(() => {
    hud.classList.remove("visible");
    document.body.classList.add("hide-cursor");
  }, 3500);
}
window.addEventListener("mousemove", showHudTemporarily);
window.addEventListener("touchstart", showHudTemporarily);
window.addEventListener("keydown", (e) => {
  if (e.key === "f" || e.key === "F") toggleFullscreen();
  if (e.key === "ArrowRight") nextItem();
  if (e.key === "m" || e.key === "M") toggleSound();
  showHudTemporarily();
});

// Double-click anywhere toggles Fullscreen
stage.addEventListener("dblclick", toggleFullscreen);

applyScreenConfig(screenCfg);
requestWakeLock();
syncPlaylist();
setInterval(syncPlaylist, 15000);
</script>
</body>
</html>
