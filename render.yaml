services:
  - type: web
    name: painel-midia-led
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 --threads 4 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: ADMIN_PASSWORD
        value: trocar123
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/data
    disk:
      name: midia-data
      mountPath: /var/data
      sizeGB: 5
